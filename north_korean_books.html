<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>북한 교과서 뷰어</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root{
            --blue:#b71c1c;
            --blue-light:#fdeaea;
            --blue-mid:#f6b5b5;
        
            --ink:#2b0000;
            --gray:#6b3d3d;
            --gray-light:#f8eded;
            --border:#c62828;
            --white:#fffaf8;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--white);
            color: var(--ink);
            font-size: 15px;
            line-height: 1.7;
        }

        /* Header */
        header{
            position:sticky;
            top:0;
            z-index:10;
            background:linear-gradient(90deg,#5a0000,#9d0000,#d50000);
            border-bottom:3px solid #ffd54f;
            box-shadow:0 3px 12px rgba(0,0,0,.35);
        }
        
        .logo{
            color:white;
        }
        
        .nav-right{
            color:#ffe082;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            height: 60px;
            max-width: 1280px;
            margin: 0 auto;
        }

        .logo-icon{
            width:48px;
            height:48px;
            border-radius:50%;
            overflow:hidden;
            border:2px solid #ffd54f;
            box-shadow:0 0 12px rgba(255,215,64,.5);
            background:#fff;
        }
        
        .logo-icon img{
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
        }

        .nav-right {
            font-size: 0.8rem;
            color: var(--gray);
        }

        /* Main Container */
        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        /* Breadcrumb */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            font-size: 0.875rem;
        }

        .breadcrumb span {
            color: var(--gray);
        }

        .breadcrumb .current {
            color: var(--blue);
            font-weight: 500;
        }

        .breadcrumb-sep {
            color: #cbd5e1;
        }

        /* Back Button */
        .back-btn {
            display: inline-block;
            margin-bottom: 1.5rem;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--gray);
            background: none;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.15s;
            font-family: inherit;
        }

        .back-btn:hover {
            color: var(--ink);
            background: var(--gray-light);
        }

        /* Title Section */
        .title-section {
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 0.75rem;
        }

        .subtitle {
            font-size: 1.125rem;
            color: var(--gray);
            font-weight: 300;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .grid-2 {
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        }

        .grid-3 {
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        }

        /* Card */
        .card {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            background: var(--white);
            transition: all 0.2s;
            cursor: pointer;
        }

        .card:hover {
            border-color: var(--blue);
            box-shadow: 0 2px 12px rgba(59, 130, 246, 0.1);
        }

        .card-icon {
            width: 48px;
            height: 48px;
            background: var(--blue-light);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .card:hover .card-icon {
            background: var(--blue-mid);
        }

        .card-badge {
            display: inline-block;
            background: var(--blue-light);
            color: var(--blue);
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            margin-bottom: 0.75rem;
        }

        .card h3 {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--ink);
        }

        .card p {
            font-size: 0.875rem;
            color: var(--gray);
            margin-bottom: 1rem;
            font-weight: 300;
        }

        .card-action {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--blue);
            font-weight: 500;
            font-size: 0.875rem;
            transition: gap 0.2s;
        }

        .card:hover .card-action {
            gap: 0.75rem;
        }

        .chevron {
            width: 16px;
            height: 16px;
            display: inline-block;
        }

        /* Section Title */
        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 1.5rem;
            margin-top: 3rem;
        }

        h2:first-of-type {
            margin-top: 0;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            animation: fadeIn 0.2s ease;
        }

        .modal.open {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: var(--white);
            border-radius: 16px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.2s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            flex: 1;
            min-width: 0;
        }

        .modal-title h3 {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 0.25rem;
            word-break: break-word;
        }

        .modal-title p {
            font-size: 0.875rem;
            color: var(--gray);
        }

        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--gray);
            padding: 0.5rem;
            margin-left: 1rem;
            flex-shrink: 0;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: var(--ink);
        }

        .modal-body {
            flex: 1;
            overflow: hidden;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading {
            text-align: center;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--blue-light);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .modal-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            border-top: 1px solid var(--border);
            background: var(--gray-light);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .modal-footer p {
            font-size: 0.75rem;
            color: var(--gray);
            margin: 0;
        }

        .modal-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            text-decoration: none;
        }

        .btn-link {
            color: var(--blue);
            background: none;
        }

        .btn-link:hover {
            background: var(--blue-light);
        }

        .btn-secondary {
            color: var(--gray);
            background: none;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        /* View States */
        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        /* Utility */
        .hidden {
            display: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            main {
                padding: 1.5rem 1rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .grid-2 {
                grid-template-columns: 1fr;
            }

            .modal-content {
                max-width: 100%;
                max-height: 95vh;
            }

            .modal-footer {
                flex-direction: column;
                align-items: flex-start;
            }

            .modal-actions {
                width: 100%;
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

            </div>

            <div class="grid grid-2">

                    <div class="card-badge" id="advancedCount">6 학년</div>
                    <div class="card-icon">📚</div>
                    <h3>고급 과정</h3>
                    <p>수재 교육용 고급 과정 교과서</p>
                    <div class="card-action">탐색하기 <span class="chevron">›</span></div>
                </div>

                <div class="card" onclick="selectCategory('일반')">
                    <div class="card-badge" id="generalCount">6 학년</div>

                </div>
            </div>

            <h2>기타 도서</h2>
            <div class="grid grid-3" id="otherBooksGrid"></div>
        </div>

        <!-- Category View -->
        <div id="categoryView" class="view">
            <button class="back-btn" onclick="goBack()">← 뒤로가기</button>
            <h2 id="categoryTitle"></h2>
            <div class="grid grid-3" id="categoryGrid"></div>
        </div>

        <!-- Books View -->
        <div id="booksView" class="view">
            <button class="back-btn" onclick="goBack()">← 뒤로가기</button>
            <h2 id="booksTitle"></h2>
            <div class="grid grid-3" id="booksGrid"></div>
        </div>
    </main>

    <!-- PDF Modal -->
    <div id="pdfModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">
                    <h3 id="modalTitle"></h3>
                    <p>전자 문서</p>
                </div>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modalBody">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>전자 문서 불러오는 중...</p>
                </div>
            </div>
            <div class="modal-footer">
                <p>문서 열람기로 전자 문서를 탐색하세요</p>
                <div class="modal-actions">
                    <a id="openNewTab" class="btn btn-link" target="_blank">
                        새 장에서 열기 ↗
                    </a>
                    <a id="downloadBtn" class="btn btn-secondary" download>
                        내 콤퓨타에 저장 ⬇
                    </a>
                </div>
            </div>
        </div>
    </div>

                "CTBooks3": [{"name": "Easy_Access2000", "url": "https://mirror.adversec.com/dprk/dprk-34c4/DPRK-34C3-PDFs/CTBooks3/Easy_Access2000.pdf"}, {"name": "Easy_Excel2000", "url": "https://mirror.adversec.com/dprk/dprk-34c4/DPRK-34C3-PDFs/CTBooks3/Easy_Excel2000.pdf"}, {"name": "Easy_PowerPoint2000", "url": "https://mirror.adversec.com/dprk/dprk-34c4/DPRK-34C3-PDFs/CTBooks3/Easy_PowerPoint2000.pdf"}, {"name": "Easy_Windows2000", "url": "https://mirror.adversec.com/dprk/dprk-34c4/DPRK-34C3-PDFs/CTBooks3/Easy_Windows2000.pdf"}, {"name": "Easy_Word2000", "url": "https://mirror.adversec.com/dprk/dprk-34c4/DPRK-34C3-PDFs/CTBooks3/Easy_Word2000.pdf"}, {"name": "fe_Access2000", "url": "https://mirror.adversec.com/dprk/dprk-34c4/DPRK-34C3-PDFs/CTBooks3/fe_Access2000.pdf"}, {"name": "fe_Excel2000", "url": "https://mirror.adversec.com/dprk/dprk-34c4/DPRK-34C3-PDFs/CTBooks3/fe_Excel2000.pdf"}, {"name": "fe_FrontPage2000", "url": "https://mirror.adversec.com/dprk/dprk-34c4/DPRK-34C3-PDFs/CTBooks3/fe_FrontPage2000.pdf"}, {"name": "fe_Office2000", "url": "https://mirror.adversec.com/dprk/dprk-34c4/DPRK-34C3-PDFs/CTBooks3/fe_Office2000.pdf"}, {"name": "fe_Outlook2000", "url": "https://mirror.adversec.com/dprk/dprk-34c4/DPRK-34C3-PDFs/CTBooks3/fe_Outlook2000.pdf"}, {"name": "fe_PowerPoint2000", "url": "https://mirror.adversec.com/dprk/dprk-34c4/DPRK-34C3-PDFs/CTBooks3/fe_PowerPoint2000.pdf"}, {"name": "fe_Publisher2000", "url": "https://mirror.adversec.com/dprk/dprk-34c4/DPRK-34C3-PDFs/CTBooks3/fe_Publisher2000.pdf"}, {"name": "fe_Windows2000", "url": "https://mirror.adversec.com/dprk/dprk-34c4/DPRK-34C3-PDFs/CTBooks3/fe_Windows2000.pdf"}, {"name": "fe_Word2000", "url": "https://mirror.adversec.com/dprk/dprk-34c4/DPRK-34C3-PDFs/CTBooks3/fe_Word2000.pdf"}]
            }
        };

        // 상태 관리
        let currentView = 'main';
        let currentCategory = null;
        let currentGrade = null;
        let navigationStack = [];

        // 초기화
        function init() {
            renderOtherBooks();
        }

        // 기타 도서 렌더링
        function renderOtherBooks() {
            const grid = document.getElementById('otherBooksGrid');
            grid.innerHTML = '';
            
            Object.keys(textbooksData.기타).forEach(folder => {
                const count = textbooksData.기타[folder].length;
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => selectGrade('기타', folder);
                card.innerHTML = `
                    <h3>${folder}</h3>
                    <p>${count} 항목</p>
                    <div class="card-action">보기 <span class="chevron">›</span></div>
                `;
                grid.appendChild(card);
            });
        }

        // 카테고리 선택
        function selectCategory(category) {
            currentCategory = category;
            currentGrade = null;
            navigationStack = [{ view: 'main' }];
            
            const categoryData = textbooksData[category];
            const grades = Object.keys(categoryData).sort();
            
            document.getElementById('categoryTitle').textContent = 
                category === '고급' ? '고급 과정' : '일반 과정';
            
            const grid = document.getElementById('categoryGrid');
            grid.innerHTML = '';
            
            grades.forEach(grade => {
                const count = categoryData[grade].length;
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => selectGrade(category, grade);
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
                        <h3>${grade}학년</h3>
                        <span class="card-badge" style="margin-bottom: 0;">${count}</span>
                    </div>
                    <p>${count}개 교과서</p>
                    <div class="card-action">탐색 <span class="chevron">›</span></div>
                `;
                grid.appendChild(card);
            });
            
            updateBreadcrumb(['홈', category]);
            showView('categoryView');
        }

        // 학년 선택
        function selectGrade(category, grade) {
            currentCategory = category;
            currentGrade = grade;
            navigationStack.push({ view: 'category', category });
            
            const books = textbooksData[category][grade];
            
            document.getElementById('booksTitle').textContent = 
                category === '기타' ? grade : `${category} 과정 - ${grade}학년`;
            
            const grid = document.getElementById('booksGrid');
            grid.innerHTML = '';
            
            books.forEach(book => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openPDF(book.name, book.url);
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; gap: 0.75rem;">
                        <div style="flex: 1; min-width: 0;">
                            <h3 style="word-break: break-word;">${book.name}</h3>
                            <p>PDF 문서</p>
                        </div>
                        <span class="chevron" style="font-size: 1.25rem; flex-shrink: 0;">›</span>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            updateBreadcrumb(['홈', category, category === '기타' ? grade : `${grade}학년`]);
            showView('booksView');
        }

        // PDF 열기
        function openPDF(name, url) {
            document.getElementById('modalTitle').textContent = name;
            document.getElementById('openNewTab').href = url;
            document.getElementById('downloadBtn').href = url;
            
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>PDF 로드 중...</p>
                </div>
            `;
            
            const iframe = document.createElement('iframe');
            iframe.src = `${url}#toolbar=1&navpanes=0`;
            iframe.onload = () => {
                modalBody.innerHTML = '';
                modalBody.appendChild(iframe);
            };
            
            document.getElementById('pdfModal').classList.add('open');
        }

        // 모달 닫기
        function closeModal() {
            document.getElementById('pdfModal').classList.remove('open');
        }

        // 뷰 전환
        function showView(viewName) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewName).classList.add('active');
            currentView = viewName;
        }

        // 뒤로가기
        function goBack() {
            if (navigationStack.length > 1) {
                navigationStack.pop();
                const prev = navigationStack[navigationStack.length - 1];
                
                if (prev.view === 'main') {
                    goHome();
                } else if (prev.view === 'category') {
                    selectCategory(prev.category);
                }
            }
        }

        // 홈으로
        function goHome() {
            currentView = 'main';
            currentCategory = null;
            currentGrade = null;
            navigationStack = [];
            updateBreadcrumb(['홈']);
            showView('mainView');
        }

        // 브레드크럼 업데이트
        function updateBreadcrumb(items) {
            const breadcrumb = document.getElementById('breadcrumb');
            breadcrumb.innerHTML = items.map((item, idx) => {
                const isCurrent = idx === items.length - 1;
                return `
                    ${idx > 0 ? '<span class="breadcrumb-sep">›</span>' : ''}
                    <span class="${isCurrent ? 'current' : ''}">${item}</span>
                `;
            }).join('');
        }

        // 모달 외부 클릭 시 닫기
        document.addEventListener('DOMContentLoaded', () => {
            init();
            
            document.getElementById('pdfModal').addEventListener('click', (e) => {
                if (e.target.id === 'pdfModal') {
                    closeModal();
                }
            });
        });
    </script>
</body>
</html>
