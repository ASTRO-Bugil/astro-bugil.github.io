<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가입 신청 관리 — ASTRO</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --blue:#3b82f6; --blue-light:#eff6ff; --blue-mid:#dbeafe;
  --ink:#1e293b; --gray:#64748b; --gray-light:#f1f5f9;
  --border:#e2e8f0; --white:#ffffff; --red:#dc2626;
  --red-light:#fef2f2; --green:#10b981; --green-light:#ecfdf5;
  --purple:#8b5cf6;
}
body { font-family:'Noto Sans KR',sans-serif; background:var(--white); color:var(--ink); font-size:15px; line-height:1.7; }

/* NAV */
nav { display:flex; align-items:center; justify-content:space-between; padding:0 6%; height:60px; border-bottom:1px solid var(--border); }
.logo { font-weight:700; font-size:1rem; color:var(--ink); text-decoration:none; display:flex; align-items:center; gap:8px; }
.logo img { width:36px; height:36px; object-fit:contain; }

header { padding:32px 6% 24px; border-bottom:1px solid var(--border); }
header h1 { font-size:1.5rem; font-weight:700; letter-spacing:-0.02em; }
header p  { font-size:0.875rem; color:var(--gray); margin-top:0.25rem; font-weight:300; }

.container { padding:32px 6%; display:flex; gap:2rem; }
.content { flex:1; }
.header-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
.header-row h2 { margin:0; font-size:1.2rem; font-weight:700; }

.list { display:flex; flex-direction:column; gap:.75rem; }
.item { border:1px solid var(--border); border-radius:14px; padding:1rem 1.25rem; display:flex; justify-content:space-between; align-items:center; transition:background 0.2s,box-shadow 0.2s; cursor:pointer; }
.item:hover { background:var(--blue-light); box-shadow:0 2px 8px rgba(59,130,246,0.08); }
.left { flex:1; }
.name { font-weight:700; margin-bottom:0.2rem; }
.sub { color:var(--gray); font-size:.82rem; }
.status-badge { font-size:0.72rem; padding:2px 8px; border-radius:12px; margin-left:0.5rem; font-weight:600; }
.status-pending  { background:var(--gray-light); color:#475569; }
.status-accepted { background:var(--green-light); color:var(--green); }
.status-rejected { background:var(--red-light);   color:var(--red); }

.actions { display:flex; gap:.5rem; flex-shrink:0; }
.btn { border:none; padding:.5rem .9rem; border-radius:8px; cursor:pointer; font-family:inherit; font-size:0.82rem; font-weight:500; transition:opacity 0.2s; }
.btn:hover { opacity:0.8; }
.pass   { background:var(--green); color:white; }
.fail   { background:var(--red);   color:white; }
.reset  { background:var(--gray-light); color:#475569; }
.delete { background:var(--red-light); color:var(--red); border:1px solid #fecaca; }

/* SIDEBAR */
.sidebar { width:240px; flex-shrink:0; border-left:1px solid var(--border); padding-left:1.5rem; }
.sidebar-title { font-size:0.75rem; font-weight:600; color:var(--gray); margin-bottom:1rem; text-transform:uppercase; letter-spacing:0.07em; }
.tabs { display:flex; flex-direction:column; gap:.5rem; }
.tab { border:1px solid transparent; background:transparent; padding:.75rem 1rem; border-radius:10px; cursor:pointer; text-align:left; font-size:0.9rem; font-family:inherit; color:#475569; transition:all 0.2s; }
.tab:hover { background:var(--gray-light); }
.tab.active { background:var(--blue-light); color:var(--blue); border-color:var(--blue-mid); font-weight:600; }
.tab-count { float:right; background:var(--border); color:var(--gray); padding:1px 7px; border-radius:12px; font-size:0.72rem; font-weight:600; }
.tab.active .tab-count { background:var(--blue); color:#fff; }

/* EMPTY */
.board-empty { text-align:center; padding:2.5rem; color:var(--gray); font-size:0.875rem; border:1px solid var(--border); border-radius:14px; }

/* MODAL */
.modal-wrap { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); align-items:center; justify-content:center; padding:1rem; z-index:100; }
.modal { background:white; width:100%; max-width:720px; border-radius:18px; padding:2rem; max-height:90vh; overflow:auto; position:relative; animation:modal-in 0.2s ease; }
@keyframes modal-in { from{opacity:0;transform:translateY(12px) scale(0.97)} to{opacity:1;transform:none} }
.modal-close { position:absolute; top:1.5rem; right:1.5rem; background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--gray); line-height:1; }
.modal-close:hover { color:var(--ink); }
.modal-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.75rem 1.5rem; margin-bottom:1.25rem; padding:1rem; background:var(--gray-light); border-radius:10px; }
.modal-grid div { font-size:0.875rem; }
.modal-grid strong { color:var(--gray); font-weight:500; display:block; font-size:0.75rem; margin-bottom:0.1rem; }
.modal-answer { margin-bottom:1.25rem; }
.modal-answer strong { font-size:0.82rem; font-weight:600; color:var(--gray); display:block; margin-bottom:0.35rem; }
pre { white-space:pre-wrap; line-height:1.75; font-family:inherit; font-size:0.875rem; background:var(--gray-light); padding:1rem; border-radius:10px; word-break:break-word; }

/* TOAST */
#toast-container { position:fixed; bottom:1.5rem; right:1.5rem; display:flex; flex-direction:column; gap:0.5rem; z-index:9999; }
.toast { padding:0.75rem 1.25rem; border-radius:10px; font-size:0.85rem; font-weight:500; box-shadow:0 4px 20px rgba(0,0,0,0.15); animation:modal-in 0.25s ease; max-width:300px; }
.toast-success { background:var(--green); color:white; }
.toast-error   { background:var(--red);   color:white; }
.toast-info    { background:var(--blue);  color:white; }

@media(max-width:800px) {
  .container { flex-direction:column-reverse; }
  .sidebar { width:100%; border-left:none; padding-left:0; border-bottom:1px solid var(--border); padding-bottom:1.5rem; }
  .modal-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">
    <img src="logo.png" alt="ASTRO">
    ASTRO — 가입 신청 관리
  </a>
  <a href="index.html" style="font-size:0.82rem;color:var(--gray);text-decoration:none;">← 메인으로</a>
</nav>

<header>
  <h1>📋 가입 신청 관리</h1>
  <p>신청자 합격/불합격 처리 및 지원서 조회</p>
</header>

<div class="container">
  <div class="content">
    <div class="header-row">
      <h2 id="current-tab-title">전체 신청자</h2>
      <button class="btn delete" id="delete-all-btn">전체 삭제</button>
    </div>
    <div class="list" id="list">
      <div class="board-empty">불러오는 중...</div>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-title">필터</div>
    <div class="tabs">
      <button class="tab active" data-status="all">전체 <span class="tab-count" id="totalCount">0</span></button>
      <button class="tab" data-status="accepted">합격자 <span class="tab-count" id="passCount">0</span></button>
      <button class="tab" data-status="rejected">불합격자 <span class="tab-count" id="failCount">0</span></button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<div class="modal-wrap" id="modalWrap">
  <div class="modal">
    <button class="modal-close" id="closeModalBtn">✕</button>
    <h2 id="modalTitle" style="margin:0 0 1.25rem;font-size:1.2rem;font-weight:700;"></h2>
    <div id="modalContent"></div>
  </div>
</div>

<script type="module" src="apply_info.js"></script>
</body>
</html>
